; =============================================================================
; MW Drift Controller by AndyQinke — 与同名 .asi 同目录
; 转角类配置单位为「弧度」（与你提供的 NFSMW2005 行为一致）
; =============================================================================

; ----- 映像与速度换算 -----
; speed.exe 首选映像基址（十进制）。常见 4194304 = 0x00400000
ImageBase=4194304
; 游戏内速度浮点若为 m/s，填 3.6 得 km/h；若已是 km/h 则填 1
车速显示换算=3.6

; ----- 内存绝对地址（VA，可写 0x 前缀十六进制）不填则使用下列内置默认值 -----
; 内置默认即你最初提供的 VA；换 exe 版本时请用 CE 核对后在此覆盖
内存地址_当前车速=0x00914654
内存地址_前轮转向角度=0x0089095C
内存地址_漂移基础值=0x008ABB7C
内存地址_滑动半径=0x008ABB78
内存地址_摩擦力缩放=0x00891050
内存地址_最大转向角度=0x008AADE8
内存地址_转向缩放=0x008AB22C
; 当前版本插件暂不写入「车身Y轴旋转」；地址仍保留供以后恢复功能
内存地址_车身Y轴旋转=0x009386CC

; ----- 功能1：车速带与回退 -----
; 前轮角逻辑见插件说明：沿用早期 sgn 公式；按下左方向键时对读入的轨道角幅度 * -1 再写入 0x89095C
; 低于等于「最低」或高于等于「最高」时功能1不写前轮角（档位逻辑也退回 1）
功能1最低车速_KmH=50
功能1最高车速_KmH=600
; 档位 1～14 共用的车速上限（km/h，须低于「功能1最高车速」）
功能1档位1至14最高车速_KmH=600
; 松开后从当前角插值回「轨道转向角度配置1」的时长（秒）
轨道转向角度回退秒=3
; 左/下 或 右/下 同时按住达到该秒数后，强制读「轨道转向角度配置5」
下键与方向轨道转向角度配置5秒=1.5

; ----- 功能1：档位 15～31 各自车速上限（km/h）与文档一致，可单独改 -----
功能1轨道档位15最高车速_KmH=350
功能1轨道档位16最高车速_KmH=340
功能1轨道档位17最高车速_KmH=330
功能1轨道档位18最高车速_KmH=320
功能1轨道档位19最高车速_KmH=310
功能1轨道档位20最高车速_KmH=300
功能1轨道档位21最高车速_KmH=290
功能1轨道档位22最高车速_KmH=280
功能1轨道档位23最高车速_KmH=270
功能1轨道档位24最高车速_KmH=260
功能1轨道档位25最高车速_KmH=250
功能1轨道档位26最高车速_KmH=240
功能1轨道档位27最高车速_KmH=230
功能1轨道档位28最高车速_KmH=220
功能1轨道档位29最高车速_KmH=210
功能1轨道档位30最高车速_KmH=200
功能1轨道档位31最高车速_KmH=190

; ----- 功能2：激活与计时 -----
; 功能2 四条激活共用的 ii（秒）
功能2激活按键输入秒=0.1
; 不低于该车速（km/h）才允许进入功能2；低于则强制回功能1
功能2激活最低车速_KmH=60
; 无左/右键持续该秒数后回功能1；该秒内再次按左右则回到等待输入并重置操作模式1 阶梯
功能2无方向键退出秒=2
; 操作模式3 最长持续秒数，超时回功能1
功能2操作模式3持续秒=3
; 操作模式1：反向键按下后，每档间隔（秒）
功能2操作模式1阶梯间隔秒=0.1
; 操作模式2：从「配置4」倒序到「配置3」的总时长（秒）；内部固定 11 个采样点
功能2操作模式2倒序总秒=1
; 操作模式2 读到「配置3」且反向键按住满该秒数后回功能1
功能2模式2配置3反向键退出延迟秒=0.1
; 退出功能2时是否写回「首次进入功能2前」的六项物理内存（1=是，0=否）
功能2退出恢复物理=1

; ----- 写入游戏的物理量（功能2 各模式会组合读写；单位依游戏原版） -----
