[CAMERA]
Enabled = 1

; ① 常规双速度（由 LookLeftKey / LookRightKey 是否按下决定，与逗号句号转头无关）
SpeedWhileLookKeys = 0.0
SpeedWhileIdle = 10.5
Speed = 0.0

; ② 规则 1、2 锁定状态下的双速度
InvertRulesSpeedWhileLookKeys = 24.5
InvertRulesSpeedWhileIdle = 12.5

SpacebarKey = 32

; 基础轨道：物理「，」与「。」（默认 VK 188 / 190，可改）
OrbitLeftKey = 188
OrbitRightKey = 190

LookLeftKey = 39
LookRightKey = 37
LookForwardKey = 380
LookBackKey = 400
; 前轮模式1 组合：LeftArrow/RightArrow + 下箭头（默认 VK_DOWN 40）
DownArrowKey = 40
; 前轮专用方向键（默认 VK_LEFT 37 / VK_RIGHT 39），与镜头 LookLeft/LookRight 独立
LeftArrowKey = 37
RightArrowKey = 39

; 规则 ①②：空格按住 XX 秒（可与 SteeringSpaceHoldSeconds 分工）
SpacebarHoldSecondsForLock = 0.1

; 仅当 FrontSteerIiSeconds<=0 时：用作「激活 ii」的替代秒数（>=0 优先于 FrontSteerSimultaneousHoldSeconds）
SteeringSpaceHoldSeconds = 0.3

; 规则 ③
InvertRulesExitAfterNoLookKeysSeconds = 0.3

; 规则 ④
LookKeyAloneDelaySeconds = 0.0

; 规则 ⑤：锁定用最大角
LockMaxAngleLeftDeg = 8
LockMaxAngleRightDeg = 8
; 第 2 点：逗号/句号基础转头最大角
OrbitBaseMaxAngleLeftDeg = 360.0
OrbitBaseMaxAngleRightDeg = 360.0

; 五条判定 + 锁定 要求车速 > 该值（km/h）；逗号句号不受此限制
MinSpeedForCameraRulesKmh = 40.0
; 前轮四条激活条件前置：车速需 > 该值（km/h），与镜头 60 独立
MinSpeedForSteerKmh = 45.0

; ========== 前轮双模式（模式1：10<v<600；模式2 激活：v>70；）==========
; 详见 NFSMW_FRONT_WHEEL.md
; ii：模式2 四条激活；模式2 退出后回模式1 冷却（Ii>0 用 Ii，否则 SteeringSpaceHoldSeconds≥0 或 FrontSteerSimultaneousHoldSeconds）
FrontSteerIiSeconds = 0.1
FrontSteerSimultaneousHoldSeconds = 0.1
FrontSteerMode1MinSpeedKmh = 45.0
FrontSteerMode1MaxSpeedKmh = 600.0
; 模式1 无键：该秒内插值回轨道配置1；模式2 无键：该秒内插值回最大角配置1
FrontSteerOrbitRampDownSeconds = 3.0
FrontSteerMode2RampDownSeconds = 3.0
FrontSteerMode2Config3DownRampSeconds = 3.0
; 模式1：轨道转向角 1～31（按住 Left/Right：0.1s 步进 1～15；16～31 另加车速上限递减，见文档）
FrontSteerOrbitAngleConfig1 = 0.00005
FrontSteerOrbitAngleConfig2 = 0.00015
FrontSteerOrbitAngleConfig3 = 0.00025
FrontSteerOrbitAngleConfig4 = 0.00035
FrontSteerOrbitAngleConfig5 = 0.00045
FrontSteerOrbitAngleConfig6 = 0.00055
FrontSteerOrbitAngleConfig7 = 0.00065
FrontSteerOrbitAngleConfig8 = 0.00075
FrontSteerOrbitAngleConfig9 = 0.00085
FrontSteerOrbitAngleConfig10 = 0.00095
FrontSteerOrbitAngleConfig11 = 0.00105
FrontSteerOrbitAngleConfig12 = 0.00115
FrontSteerOrbitAngleConfig13 = 0.00155
FrontSteerOrbitAngleConfig14 = 0.00195
FrontSteerOrbitAngleConfig15 = 0.00235
FrontSteerOrbitAngleConfig16 = 0.00275
FrontSteerOrbitAngleConfig17 = 0.00315
FrontSteerOrbitAngleConfig18 = 0.0032
FrontSteerOrbitAngleConfig19 = 0.00325
FrontSteerOrbitAngleConfig20 = 0.0033
FrontSteerOrbitAngleConfig21 = 0.00335
FrontSteerOrbitAngleConfig22 = 0.0034
FrontSteerOrbitAngleConfig23 = 0.00345
FrontSteerOrbitAngleConfig24 = 0.0035
FrontSteerOrbitAngleConfig25 = 0.00355
FrontSteerOrbitAngleConfig26 = 0.0036
FrontSteerOrbitAngleConfig27 = 0.00365
FrontSteerOrbitAngleConfig28 = 0.0037
FrontSteerOrbitAngleConfig29 = 0.00375
FrontSteerOrbitAngleConfig30 = 0.0038
FrontSteerOrbitAngleConfig31 = 0.00385
; 模式1：Left+Down 或 Right+Down 同按达该秒写轨道配置10
FrontSteerOrbitDownComboHoldSeconds = 1.5
; 模式2：无方向键退出秒数；操作模式2+3 持续超过该秒退出
FrontSteerNoLookExitSeconds = 1.5
FrontSteerMode23SustainExitSeconds = 3.0
; 模式2 对侧斜坡：1.1～2.0s 含 Config2_9；≥2.1s 为 Config3
FrontSteerMaxAngleConfig1 = 0.00285
FrontSteerMaxAngleConfig1_1 = 0.00245
FrontSteerMaxAngleConfig1_2 = 0.00205
FrontSteerMaxAngleConfig1_3 = 0.00185
FrontSteerMaxAngleConfig1_4 = 0.00175
FrontSteerMaxAngleConfig1_5 = 0.00165
FrontSteerMaxAngleConfig1_6 = 0.00145
FrontSteerMaxAngleConfig1_7 = 0.00145
FrontSteerMaxAngleConfig1_8 = 0.00145
FrontSteerMaxAngleConfig1_9 = 0.00145
FrontSteerMaxAngleConfig2 = 0.00145
FrontSteerMaxAngleConfig2_1 = 0.00145
FrontSteerMaxAngleConfig2_2 = 0.00145
FrontSteerMaxAngleConfig2_3 = 0.00165
FrontSteerMaxAngleConfig2_4 = 0.00175
FrontSteerMaxAngleConfig2_5 = 0.00185
FrontSteerMaxAngleConfig2_6 = 0.00225
FrontSteerMaxAngleConfig2_7 = 0.00265
FrontSteerMaxAngleConfig2_8 = 0.00305
FrontSteerMaxAngleConfig2_9 = 0.00345
FrontSteerMaxAngleConfig3 = 0.00385
FrontSteerMaxAngleConfig4 = 0.00145

; ================== Mode2 物理参数伴生插件（Mode2PhysicsBridge.asi） ==================
; 仅在前轮模式2激活时生效，退出模式2自动恢复原值（RestoreOnExit=1）
Mode2PhysicsEnabled = 1
Mode2PhysicsPollMs = 10
Mode2PhysicsRestoreOnExit = 1
; 原插件模块名与模式2状态偏移（默认适配当前拆解版本）
Mode2PhysicsModuleName = NFSMWOrbitCamera.asi
Mode2PhysicsStateOffset = 0x3FF40

; 模式2激活时写入值（按需自行调参）
Mode2MinDriftBaseValue = 2.0
Mode2MinSlipRadValue = 2.55
Mode2FrictionScaleValue = 1.25
Mode2MaxSteeringAngleValue = 1.05
Mode2SteeringScaleValue = 1.45

; ================== Mode1 frictionScale 分段联动（Mode2PhysicsBridge.asi） ==================
; 模式1读取 FrontSteerOrbitAngleConfig5~15 时使用
frictionScale1 = 1.0
; 模式1读取 FrontSteerOrbitAngleConfig16~25 时使用
frictionScale2 = 1.0
; 模式1读取 FrontSteerOrbitAngleConfig26~31 时使用
frictionScale3 = 1.0
; 模式1触发 FrontSteerOrbitDownComboHoldSeconds 对应组合时使用
frictionScalebrake = 1.0

; ================== Mode2 分段联动（Mode2PhysicsBridge.asi） ==================
; FrontSteerMaxAngleConfig1 ~ FrontSteerMaxAngleConfig1_3 区间使用
MinSlipRadValue = 4.55
; FrontSteerMaxAngleConfig1_4 ~ FrontSteerMaxAngleConfig2_7 区间使用
MidSlipRadValue = 4.2
; FrontSteerMaxAngleConfig2_8 ~ FrontSteerMaxAngleConfig3 区间使用
frictionScaledrift3 = 1.5