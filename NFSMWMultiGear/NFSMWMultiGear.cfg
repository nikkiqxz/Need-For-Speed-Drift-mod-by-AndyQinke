# NFSMW MultiGear per-transmission configuration
#
# Format:
#   transmission_name  maximum_forward_gears  gear8_ratio  gear8_power  ...  gear12_ratio  gear12_power
#
# The second field counts forward gears. Each added gear has a ratio followed
# by its power multiplier. A multiplier of 1 keeps the native delivered power.
# Only exact names listed here are changed; every other transmission remains
# native.
#
# Current 12-gear manual test row for the confirmed sf90_top transmission.
# Remove or comment it to return that car to the stock seven-forward-gear
# behavior.
sf90_top 12 0.639 1 0.622 1 0.611 1 0.600 1 0.585 1

# Eight forward gears use one ratio/multiplier pair:
# clk500_top 8 0.701 1

# A ten-forward-gear example:
# 997_top 10 0.639 1 0.622 1 0.611 1

# Equivalent raw-slot spelling (reverse + neutral + forward gears):
# viper_top slots=14 0.701 1 0.622 1 0.548 1 0.487 1 0.431 1

# Legacy ratio-only rows remain supported and default every multiplier to 1:
# legacy_top 12 0.701 0.622 0.548 0.487 0.431

# Always provide every ratio/power pair in the new format. Because legacy
# ratio-only rows are still accepted, a truncated paired row can otherwise
# look like a complete legacy row. Ordinary incomplete legacy rows are logged
# and skipped; missing ratios are never guessed:
# incomplete_top 12 0.639
