; NFSMW 2005 漂移与驾驶辅助 - 1.1.0 正式版配置
; 适用范围：离线单人比赛，仅支持由 MultiGear 签章并改名为 speed.exe 的主程序。
;
; 起飘强推、固定角度保持和旧自动回正仍保持删除。只有玩家当前明确输入方向时，
; 插件才会提供有限的车身旋转辅助；方向中立和自动反打期间不修改车身角速度。
; 同向缩小漂移半径的辅助会在 2 秒内线性建立；反向退漂会主动指向 0 度并在中心前卸力。
; 1.1.0 正式版保留经过严格读回校验的漂移刚体加速/减速 writer，并包含
; 低优先级驾驶辅助模式及 ABS/ESC/TCS/LC HUD；漂移激活时驾驶辅助立即注销，退出
; 0.2 秒后恢复。反打时按
; 反打时仅取实际前轮反打角的 12.5% 作为相对车头的施力偏转（旧 half-angle 中间夹角
; 偏转的 25%）；顺打、中立或回正时严格沿车头施力。
; 前轮抓地和实际驱动轮正向动力仍不写入，下面两个倍率仅作预留并保持 1.0。
;
; 按下手刹即建立本次辅助会话。车头相对实际行进方向达到 15 度且玩家方向
; 当前中立时，首次自动请求“55 度基础角 x 当前车辆倍率”，无需先等 0.20 秒。自动反打已接管后，
; 任意方向的有效人工输入只要超过死区，就在当前更新立即取消自动反打并把前轮交还玩家；
; 输入方向与自动反打相同也不例外。
; 首次自动接管前，waiting-angle 中立帧透传玩家原始输入并清除起飘顺打残值。
; 自动反打和人工方向都使用 0.9.5 的固定 2.0 command/s 路径，从当前实际指令
; 按剩余距离连续追向目标，不缩小最终满舵角度。小补 5 度约需 0.042 秒，满左到满右约需 1 秒。
; 只有自动反打被人工打断后，松手才重新累计 0.20 秒；reengage-delay 期间
; 保持最后实际已应用方向，不主动回零，随后自动反打从该实值连续接续。
; 钟摆换边等待会清除旧侧自动轨迹，不能把上一次反打方向带到新侧。
; 已建立的漂移穿过中心线时进入 0.50 秒钟摆观察窗：期间完全透传玩家方向且不写
; 车身横摆；相反侧达到 6 度则提交新漂移侧，否则干净结束本次辅助会话。
; 功能宿主按已提交漂移侧请求相反的相机轨道符号：左漂 +3 度、右漂 -3 度。
; 从中间到一侧用 2.0 秒 smoothstep；归中和折身换边用更快的 1.25 秒。
; 该镜头行为不是 INI 可调项，链不兼容时只关闭镜头辅助。
;
; 角度单位为弧度，速度为米/秒，时间为秒，角速度为弧度/秒。

[AssistConfig]

enabled=true
activation=HandbrakeHold

; 自动反打写前轮；人工方向辅助只写车身偏航角速度。
actuation=SteeringAndAttitude

; 以车头相对实际行进方向的夹角判断是否达到智能反打门槛。
useVelocityRelativeDriftAngle=true

requirePlayer=true
allowReverse=false
enableYawVelocityAssist=false
enableThrottleProtection=false

; 8 米/秒约为 29 千米/小时。
minSpeedMps=8.0
minLongitudinalSpeedMps=6.0
minGroundedWheels=2
; 已建立漂移后，接地轮数短暂低于门槛不会立即清空会话；连续 3 秒才退出。
; 新会话激活前仍必须至少有 minGroundedWheels 个轮胎接地。
groundContactLossGraceSeconds=3.0

; 本版按下手刹即建立会话，不再要求长按计时。
handbrakeActivationHoldSeconds=0.0
handbrakeActivationThreshold=0.50
directionDeadzone=0.15

; 尚未达到过 15 度且已经松开手刹时，空闲两秒结束未使用会话。
; 这只是生命周期超时，不会自动旋转或回正车身。
noDirectionTimeoutSeconds=2.0

; 智能反打总开关。
enableSmartCountersteer=true

; 车身相对行进方向达到 15 度后，才允许自动反打。
countersteerActivationBodyOffsetRad=0.26179939

; 15 度是取得控制权门槛；接管后保持到约 5 度再释放，避免门槛附近抖动。
exitBodyOffsetRad=0.08726646

; 自动反打基础请求为 55 度；每车倍率在文件末尾配置。倍率 1.0 时，按
; maximumSteerAngleRad=60 度换算后的归一化目标约为 0.9167。
smartCountersteerAngleRad=0.95993109

; 仅在自动反打被人工输入打断后，玩家回到中立需等待 0.20 秒才重新接管。
; 首次达到 15 度且方向本来就是中立时会立即接管。
smartCountersteerReengageDelaySeconds=0.20

; 旧配置兼容键；当前 live 人工转向不读取该值，而是固定使用 0.9.5 的
; 2.0 command/s 路径。reengage-delay 中立帧保持最后实际指令。
manualSteeringTransitionSeconds=1.375

; 人工车身旋转辅助。本次会话的首次方向暂定漂移侧，达到 15 度后锁定；换边只由
; 下方显式钟摆观察窗提交，宿主不会自行按测量角翻转旧侧。
enableManualYawAssist=true

; 同向输入只补足不足的自然旋转，不会刹慢已经更快的同向旋转。
manualSameDirectionTargetYawRateRadS=0.5625
manualSameDirectionYawAccelerationRadS2=3.0
manualSameDirectionMaximumYawAngularDelta=0.15
; 连续同向输入从 15% 力度线性增长，2 秒达到全强度。
manualSameDirectionRampSeconds=2.0
manualSameDirectionInitialStrength=0.15

; 反向输入主动建立朝 0 度的回正角速度；剩余角度、刹停距离和单帧距离共同限速，
; 进入中心零区即撤销写入，避免回正后残留反向旋转惯性。
manualOppositeMaximumRecoveryYawRateRadS=0.45
manualOppositeYawDampingAccelerationRadS2=4.5
manualOppositeMaximumYawAngularDelta=0.15
; 35 度以外禁止继续注入同向旋转。
manualYawHardBodyOffsetRad=0.61086524

; 钟摆换边：旧侧已达到 15 度后，反向输入进入正负 2 度中心区时打开观察窗。
; 0.50 秒内相反侧达到 6 度即提交新侧；否则退出，期间不自动反打也不写 yaw。
pendulumTransitionZeroBandRad=0.03490659
pendulumTransitionConfirmBodyOffsetRad=0.10471976
pendulumTransitionWindowSeconds=0.50

; 玩家任一方向输入的绝对值大于 directionDeadzone 时，本帧立即取得控制权并取消自动反打。
; 人工目标从当前实际指令以 2.0 command/s 追赶，持续输入仍可达到完整正负 1.0 行程。
; 旧版自动同向满舵、平滑过渡和动态反打路径保持关闭。
sameDirectionFullSteerSeconds=0.0
countersteerTransitionSeconds=0.0
minimumCountersteerAngleRad=0.0
maximumCountersteerAngleRad=0.0

; 下列兼容参数显式归零，防止旧起飘、15 度保持和任何 yaw 控制重新启用。
minimumDriftBodyOffsetRad=0.0
bodyOffsetHoldSpeedRadS=0.0
bodyOffsetHoldYawAccelerationRadS2=0.0
bodyOffsetHoldMaximumYawAngularDelta=0.0
bodyOffsetHoldSlowdownOffsetRad=0.0
driftAngleEntrySeconds=0.0
driftAngleEntrySpeedRadS=0.0
driftAngleEntryYawAccelerationRadS2=0.0
driftAngleEntryOffsetCutoffRad=0.0
driftAngleEntryMaximumYawAngularDelta=0.0
bodyRotationSpeedRadS=0.0
bodyYawAccelerationRadS2=0.0
maximumYawAngularDelta=0.0
bodyRotationSlowdownOffsetRad=0.0
entryYawBoostSeconds=0.0
entryYawBoostRateRadS=0.0
entryYawBoostAccelerationRadS2=0.0
entryYawBoostOffsetCutoffRad=0.0
entryYawBoostMaximumYawAngularDelta=0.0
directionChangeSpeedRadS=0.0
directionChangeYawAccelerationRadS2=0.0
directionChangeMaximumYawAngularDelta=0.0
directionChangeSlowdownOffsetRad=0.0
autoCenterSpeedRadS=0.0
autoCenterYawAccelerationRadS2=0.0
autoCenterMaximumYawAngularDelta=0.0
autoCenterSlowdownOffsetRad=0.0

; 前轮抓地/实际驱动轮正向动力 writer 仍未开放，必须保持 1.0；刚体加速/减速由
; 1.0.1 正式版的编译开关控制，不由此兼容倍率字段控制。
; rearDriveMultiplierDuringDrift 是兼容旧接口名；未来由原生传动系统分配到实际驱动轮。
frontGripMultiplierDuringDrift=1.0
rearDriveMultiplierDuringDrift=1.0

; 游戏最大前轮转向角按 60 度换算智能反打请求。
maximumSteerAngleRad=1.04719755

blendInSeconds=0.12
blendOutSeconds=0.22

; 人工 yaw 有独立限幅；姿态权限保持完整，空中仍禁用。
attitudeAuthority=1.0
airborneAuthority=0.0
maximumRollAngularDelta=0.0
maximumPitchAngularDelta=0.0

[SmartCountersteerVehicleMultipliers]

; 键名使用该车传动部件的属性节点名（与 NFSMWMultiGear.cfg 相同，例如
; tt 车下的 laferrari_top），忽略大小写。沿传动 Collection 父链匹配，
; 不将 pvehicle 的 tt 基底误认成部件节点。
; 值会乘到 AssistConfig.smartCountersteerAngleRad 上；未列出的车辆使用 1.0。
; 有效范围为 0.0 到 2.0，最终结果仍受 maximumSteerAngleRad 限制。
; 以下四项对应 55 度基础反打角的 41.25、47.025、12.1 和 8.25 度。
laferrari_top 0.75
997s=0.855
a3=0.22
a4=0.15

; 刚体减速不是 INI 可调项：手刹连续保持至少 0.20 秒且仍处于按下状态时生效，
; 并立即覆盖刚体加速。100 km/h 及以下为最大减速的 15%，100-180 km/h
; 线性增加，180 km/h 及以上达到最大；最大减速为低速最大补速的 1.15 倍。
