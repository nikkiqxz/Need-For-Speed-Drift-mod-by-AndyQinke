; NFSMW 2005 漂移辅助示例配置
; 以下所有键均与 nfsmw_drift::AssistConfig 一一对应。
; 角度单位为弧度，速度单位为米/秒，时间单位为秒，角速度单位为弧度/秒。
; 宿主读取此文本后，将其传给 ParseAssistConfigIni()。解析器会忽略未知的键/节；
; 随后由控制器对各项取值范围进行清理和限制。

[AssistConfig]

; 总开关。
enabled=true

; HandbrakeHold | Manual | Automatic | ManualOrAutomatic
; HandbrakeHold 是 0.9.13 的手刹漂移会话模式：达到手刹输入阈值即建立会话，
; 车身相对行进方向达到设定角度后才允许智能反打。
activation=HandbrakeHold

; SteeringOnly | SteeringAndAttitude | AttitudeOnly
; 0.9.13 的完整功能需要 SteeringAndAttitude。SteeringOnly 仅保留前轮自动反打，
; AttitudeOnly 则不会写入自动反打的前轮方向。
actuation=SteeringAndAttitude

; true 时 HandbrakeHold 使用车头相对实际行进方向的漂移角。
; 0.9.13 功能宿主要求此项为 true。
useVelocityRelativeDriftAngle=true

; 当 VehicleState::playerControlled 为 false 时拒绝提供辅助。
requirePlayer=true

; 允许在纵向速度为负（倒车）时运行控制器。
allowReverse=false

; 旧版侧滑模式兼容键。0.9.13 不再由它生成 yaw；HandbrakeHold 的人工方向
; yaw 只由下方 enableManualYawAssist 及其独立限幅参数控制。
enableYawVelocityAssist=false

; 在旧版侧滑激活模式下，当侧滑达到极端值时，允许 throttleScale 和 brakeAdd 输出恢复控制。
; HandbrakeHold 不会执行该分支。
enableThrottleProtection=true

; 车辆总速度下限。10 米/秒约等于 36 千米/小时。
minSpeedMps=10.0

; 用于激活和旧版自动模式的绝对纵向速度下限。
; HandbrakeHold 锁定激活后会继续使用总速度，因此较大的车身偏航角不会因其纵向投影下降
; 而让漂移提前结束。
minLongitudinalSpeedMps=7.0

; 正常辅助所需的最少接地车轮数。
minGroundedWheels=2

; 手刹漂移会话建立后，接地数低于门槛连续达到该时长才退出。
; 只影响已激活会话；激活前仍立即要求满足 minGroundedWheels。
groundContactLossGraceSeconds=3.0

; 自动进入模式的车身侧滑角阈值：8 度。
enterSideslipRad=0.13962634

; 退出阈值：4 度。应低于 enterSideslipRad，以形成滞回区。
exitSideslipRad=0.06981317

; 自动进入模式的后轮平均滑移阈值。
enterRearSlip=0.12

; 后轮滑移退出阈值。应低于 enterRearSlip。
exitRearSlip=0.07

; 自动进入模式的手刹阈值，归一化范围为 0..1。
enterHandbrake=0.25

; 0.9.13 保留 holdSeconds 键仅用于兼容旧配置；手刹达到阈值即建立会话。
; 退出后必须先松开一次手刹，才能重新武装下一次会话。
handbrakeActivationHoldSeconds=0.0
handbrakeActivationThreshold=0.50

; 超过此死区的任意方向都算人工操作，并在当前轮询立即取消自动反打、交还玩家。
directionDeadzone=0.15

; 智能反打：首次达到 15 度且方向中立时立即接管；自动反打被人工输入
; 打断后，需连续中立 0.20 秒并再次满足角度门槛才会重新接管。
enableSmartCountersteer=true
countersteerActivationBodyOffsetRad=0.26179939
smartCountersteerAngleRad=0.95993109
smartCountersteerReengageDelaySeconds=0.20

; 首次自动接管前，waiting-angle 中立帧透传玩家原始输入并清除起飘顺打残值。
; 自动反打和有效人工方向都沿用 0.9.5 的固定 2.0 command/s 路径，从当前实际
; 前轮指令按剩余距离追向完整目标，最终转向角不被裁剪。
; 人工松手后的 0.20 秒 reengage-delay 保持最后实际方向，不主动回零；随后自动
; 从该实值连续接续。钟摆换边等待会清除旧侧自动轨迹。
; 旧配置兼容键；当前 live 人工转向不读取该值。
manualSteeringTransitionSeconds=1.375

; 功能宿主按已提交漂移侧请求相反的相机轨道符号：左漂 +3 度、右漂 -3 度。
; 中间到一侧使用 2.0 秒 smoothstep；归中和折身换边使用更快的 1.25 秒。
; 该行为不是配置键，链不兼容时只关闭镜头辅助。

; 人工方向车身旋转辅助。它不负责起飘或保角，只有玩家本帧方向超过死区才工作。
; 首次方向可暂定漂移侧；已建立的换边只能由下方钟摆观察窗提交。
enableManualYawAssist=true

; 同向输入只补到目标相对角速度，现有自然旋转更快时不施加制动。辅助力度
; 从 15% 开始，连续输入两秒后线性达到全强度。
manualSameDirectionTargetYawRateRadS=0.5625
manualSameDirectionYawAccelerationRadS2=3.0
manualSameDirectionMaximumYawAngularDelta=0.15
manualSameDirectionRampSeconds=2.0
manualSameDirectionInitialStrength=0.15

; 反向输入主动建立朝 0 度的回正角速度，并按刹停距离和剩余角度在中心前卸力。
; 到达 35 度后停止继续向外助推。
manualOppositeMaximumRecoveryYawRateRadS=0.45
manualOppositeYawDampingAccelerationRadS2=4.5
manualOppositeMaximumYawAngularDelta=0.15
manualYawHardBodyOffsetRad=0.61086524

; 已建立的漂移在反向输入下进入正负 2 度中心区后，打开 0.50 秒钟摆观察窗。
; 窗口内相反侧达到 6 度则提交新漂移侧；否则干净退出。观察期间不自动覆盖前轮，
; 清除旧侧自动轨迹且不写 yaw；有效人工方向仍按上方 2.0 command/s 路径执行。
pendulumTransitionZeroBandRad=0.03490659
pendulumTransitionConfirmBodyOffsetRad=0.10471976
pendulumTransitionWindowSeconds=0.50

; 以下为旧版 HandbrakeHold 转向序列兼容键，0.9.13 智能反打不使用。
sameDirectionFullSteerSeconds=0.25
countersteerTransitionSeconds=0.20

; 旧动态反打角兼容键；0.9.13 固定使用 smartCountersteerAngleRad。
minimumCountersteerAngleRad=0.17453293
maximumCountersteerAngleRad=0.61086524

; 自动反打在此角度内释放；会话只会在角度和相对旋转速度均稳定后退出。
exitBodyOffsetRad=0.08726646

; 尚未达到智能反打门槛且手刹已松开时，空闲到此时长结束未使用会话。
; 该超时不会旋转或回正车身。
noDirectionTimeoutSeconds=2.0

; 以下旧车身偏航控制键仅为兼容保留；0.9.13 的人工 yaw 不读取这些键。
minimumDriftBodyOffsetRad=0.26179939
bodyOffsetHoldSpeedRadS=0.40
bodyOffsetHoldYawAccelerationRadS2=4.0
bodyOffsetHoldMaximumYawAngularDelta=0.10
bodyOffsetHoldSlowdownOffsetRad=0.17453293

; 速度方向相对模式首次锁边后，先固定获取 minimumDriftBodyOffsetRad。
; 以下强档只改变这段相对角闭环的速度包络，不是旧世界朝向的绝对偏航脉冲。
; 松开同向键、反向、碰撞、低前向速度、倒车或失地会立即取消强档；
; 之后仍用普通保持档继续取得基础角。
driftAngleEntrySeconds=0.18
driftAngleEntrySpeedRadS=0.90
driftAngleEntryYawAccelerationRadS2=9.0
driftAngleEntryOffsetCutoffRad=0.20943951
driftAngleEntryMaximumYawAngularDelta=0.20

; 持续按住方向键时的车身偏航目标速度。自动回正速度为 0 时使用此速度。
; 角度/角速度单位分别为弧度和弧度/秒。
bodyRotationSpeedRadS=1.57079633
bodyRotationSlowdownOffsetRad=0.17453293

; 首次锁定漂移方向后的一次性起漂助推。目标速度必须高于持续偏航速度才生效；
; 起漂和持续同向控制只沿请求方向增加偏航，不会反向制动自然横摆。
; 设 entryYawBoostRateRadS=0 或 entryYawBoostSeconds=0 可关闭。
; 为避免过冲，持续时间最多 0.25 秒、目标速度最多 0.90 rad/s、
; 加速度最多 6.0 rad/s²、偏移截止角最多 15 度。
entryYawBoostSeconds=0.18
entryYawBoostRateRadS=0.0
entryYawBoostAccelerationRadS2=4.0
entryYawBoostOffsetCutoffRad=0.20943951
entryYawBoostMaximumYawAngularDelta=0.20

; 正常同向控制的偏航速度最大变化率和单帧修正上限。
bodyYawAccelerationRadS2=3.0

; 反向恢复使用独立的快速换向档。
directionChangeSpeedRadS=0.38
directionChangeYawAccelerationRadS2=6.0
directionChangeMaximumYawAngularDelta=0.20
directionChangeSlowdownOffsetRad=0.26179939

; 自动回正速度为 0 时沿用 bodyRotationSpeedRadS；回正另有独立快速档，
; 并在最后 12 度内逐渐降低目标速度。
autoCenterSpeedRadS=0.0
autoCenterYawAccelerationRadS2=6.0
autoCenterMaximumYawAngularDelta=0.20
autoCenterSlowdownOffsetRad=0.20943951

; 速度方向相对模式在退出窗口内使用的相对角速度阈值、稳定时长和
; 行进方向角速度滤波时间。
exitDriftAngleRateRadS=0.03490659
exitSettleSeconds=0.10
driftAngleRateFilterSeconds=0.10

; 对测得/预测的车身偏航偏移量设置的安全上限。这不是反打角上限，
; 因此可以大于 35 度。
maximumBodyOffsetRad=1.57079633

; HandbrakeHold 漂移期间预留的倍率：1 为不变，<1 为削弱，>1 为增强。
; v0.9.13 主 Alpha 不会把这两个倍率写入游戏物理；刚体加速由编译期开关控制。
; 前轮倍率未来只用于前轮侧向抓地；rearDriveMultiplierDuringDrift 是兼容旧接口名，
; 未来只放大正向总驱动扭矩，由原生传动系统分配到实际驱动轮。
frontGripMultiplierDuringDrift=1.0
rearDriveMultiplierDuringDrift=1.0

; 期望保持的侧滑角幅值：11 度。
targetSideslipRad=0.19198622

; 目标/恢复用的侧滑角硬上限：35 度。
maximumSideslipRad=0.61086524

; 用于偏航角速度参考值计算的车辆轴距。
wheelbaseM=2.65

; 功能 Alpha 用于换算智能反打命令的转向角标定：60 度。
maximumSteerAngleRad=1.04719755

; 自行车模型偏航角速度参考值的缩放系数。
yawReferenceScale=0.80

; 旧版侧滑模式（Manual/Automatic/ManualOrAutomatic）的绝对目标偏航角速度上限。
; HandbrakeHold 使用自身 20 rad/s 的硬性安全上限，并且还会受到 maximumYawAngularDelta 限制。
maximumYawRateRadS=2.8

; 侧滑误差的比例增益。
sideslipKp=1.25

; 侧滑变化率的微分增益。
sideslipKd=0.10

; 偏航角速度跟踪误差的比例增益。
yawRateKp=0.28

; 施加于测得偏航角速度的额外阻尼。
yawRateDamping=0.08

; 归一化转向修正量的最大幅值。
maximumSteeringCorrection=0.24

; 归一化转向修正量每秒允许的最大变化量。
maximumSteeringCorrectionRate=3.5

; 总体转向修正权限，归一化范围为 0..1。
steeringAuthority=0.80

; 将辅助权限从 0 平滑过渡到完整权限所需的时间。
blendInSeconds=0.12

; 离开漂移状态后，将辅助权限平滑降为 0 所需的时间。
blendOutSeconds=0.22

; 当 VehicleState::collisionRecent 为 true 时使用的权限倍率。
collisionAuthority=0.25

; 车身横滚姿态的比例/微分增益（旧版侧滑模式）。
rollKp=4.0
rollKd=1.8

; 车身俯仰姿态的比例/微分增益（旧版侧滑模式）。
pitchKp=2.8
pitchKd=1.4

; 可选偏航角速度辅助的增益。
yawVelocityKp=0.40

; 总体横滚/俯仰/偏航姿态权限，归一化范围为 0..1。
attitudeAuthority=0.65

; 接地车轮过少时的姿态控制权限。设为 0 可禁用空中控制。
airborneAuthority=0.0

; 每帧局部角速度增量限制（弧度/秒）。
maximumRollAngularDelta=1.20
maximumPitchAngularDelta=0.80
maximumYawAngularDelta=0.60

; 当侧滑角达到或超过 recoverySideslipRad 时，最多削减的油门比例。
throttleCutAtMaximumSlip=0.16

; 当侧滑角达到或超过 recoverySideslipRad 时，最多增加的归一化刹车量。
recoveryBrakeAtMaximumSlip=0.10

; 达到完整油门/刹车保护时的侧滑角：28 度。
recoverySideslipRad=0.48869219
