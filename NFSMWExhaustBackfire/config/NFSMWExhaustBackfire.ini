[burst]
# Legacy burst values are retained for adapter compatibility. Paired mode below
# replaces them in the shipped configuration.
burst_min_shots=4
burst_max_shots=8
# Downshifts are more likely, but use fewer pops per successful trigger.
downshift_burst_min_shots=2
downshift_burst_max_shots=4
burst_window_ms=500

[shift_pattern]
# Every upshift chooses exactly one of these three outcomes: both sides together
# (33.75%), both sides 300 ms apart (26.25%), or no event (40%).
paired_shift_mode=true
shift_simultaneous_probability=0.3375
shift_sequential_probability=0.2625
# Every deliberate downshift above the global 4000 RPM gate has an independent
# fixed 80% chance. The two values above only choose the pattern after success.
paired_downshift_probability=0.80
paired_side_delay_ms=300

[sustained]
# After one second at the limit without shifting, keep trying at random
# intervals. Normal attempts use 40%; neutral with deliberate throttle uses 70%.
sustained_threshold_ms=1000
sustained_min_interval_ms=275
sustained_max_interval_ms=750
sustained_probability=0.40
neutral_sustained_probability=0.70
neutral_min_gas_input=0.25

[flame_audio]
# Each successfully spawned side independently gates one event-level audio batch.
upshift_flame_audio_probability=0.50
downshift_flame_audio_probability=0.70
sustained_flame_audio_probability=0.30
# All successful batches choose simultaneous or staggered playback equally.
audio_batch_sequential_probability=0.50

[probability]
# Legacy burst-mode values below are used only when paired_shift_mode=false.
# <=6500 RPM: 40%; >=9000 RPM: 90%; values between are interpolated.
low_max_rpm=6500
high_max_rpm=9000
low_probability=0.40
high_probability=0.90
# In legacy mode, a 9000+ RPM car gets 45% upshift and 90% downshift.
upshift_probability_scale=0.50
downshift_probability_scale=1.00

[rpm_detection]
# Upshifts trigger near the limit. Downshifts have their own lower threshold.
near_limit_ratio=0.985
downshift_min_rpm_ratio=0.70
# Retained for compatibility with older INI files; v1.1.10 no longer requires
# pedal input for a downshift above the global 4000 RPM gate.
downshift_min_control_input=0.05
sustained_limit_ratio=0.995

[markers]
require_both_markers=true

[ExhaustSmoke]
# Requires NFSMWExhaustBackfire-Smoke.nfsms to be imported once with NFS-VltEd.
# 0 disables the companion exhaust vapor. Intensity accepts 0.0 through 2.0;
# v1.1.48 increases the v1.1.47 smoke density by another 15%.
enabled=1
intensity=1.3225

[replacement]
suppress_vanilla=true
effect_id=exhaust_backfire
effect_variant=0

[runtime]
max_tracked_vehicles=1
# 0 means a fresh random seed each launch. Non-zero is useful for tests.
random_seed=0

[BackfireToneVariation]
# Each audio batch makes one shared decision. Farther values receive a stronger
# pull; a distance of 0.60 can return fully to neutral. Values near 1.0 move
# less but may cross to the other side by up to 0.20 for additional variety.
batch_toward_neutral_probability=0.30
batch_toward_neutral_amount=1.00
batch_full_neutral_distance=0.60
batch_max_neutral_overshoot=0.20

